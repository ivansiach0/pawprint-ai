services:
  - type: web
    name: pawprint-ai-web
    runtime: node
    branch: master
    region: ohio
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PAWPRINT_API_ORIGIN
        sync: false

  - type: web
    name: pawprint-ai-api
    runtime: node
    branch: master
    region: ohio
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev
    startCommand: npm run start:api:render
    healthCheckPath: /health
    envVars:
      - key: API_HOST
        value: "0.0.0.0"
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
